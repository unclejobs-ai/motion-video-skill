="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">컷·홀드 · 광학 흐름</text><text x="64" y="480" class="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">블러 · 심도 띠 · 그레인 · 질감</text><rect x="40" y="604" width="400" height="172" rx="4" fill="#fff" stroke="#c2410c" stroke-width="3"/><text x="64" y="652" class="k" font-size="30" font-weight="800" fill="#c2410c" text-anchor="start">ref/targets.json</text><text x="64" y="696" class="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">지표별 목표와 허용 오차</text><text x="64" y="732" class="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">ANALYSIS.md가 인용</text><rect x="40" y="856" width="400" height="172" rx="4" fill="#fff" stroke="#0a0a09" stroke-width="2"/><text x="64" y="904" class="k" font-size="30" font-weight="800" fill="#0a0a09" text-anchor="start">계획</text><text x="64" y="948" class="m" font-size="23" font-weight="600" fill="#0a0a09" text-anchor="start">plan.mjs → plan.ts</text><text x="64" y="984" class="m" font-size="23" font-weight="600" fill="#0a0a09" text-anchor="start">look-fit.mjs → look.ts</text><rect x="520" y="856" width="400" height="172" rx="4" fill="#fff" stroke="#0a0a09" stroke-width="2" stroke-dasharray="8 6"/><text x="544" y="904" class="k" font-size="30" font-weight="800" fill="#0a0a09" text-anchor="start">엔진  바꿔 끼움</text><rect x="540" y="926" width="174" height="84" rx="3" fill="#fff" stroke="#0a0a09" stroke-width="1.6"/><text x="627" y="962" class="m" font-size="20" font-weight="600" fill="#0a0a09" text-anchor="middle">Remotion</text><text x="627" y="994" class="k" font-size="19" font-weight="400" fill="#57554f" text-anchor="middle">carry · wordcut</text><rect x="726" y="926" width="174" height="84" rx="3" fill="#fff" stroke="#0a0a09" stroke-width="1.6"/><text x="813" y="962" class="m" font-size="20" font-weight="600" fill="#0a0a09" text-anchor="middle">HyperFrames</text><text x="813" y="994" class="k" font-size="19" font-weight="400" fill="#57554f" text-anchor="middle">HTML · GSAP</text><rect x="520" y="604" width="400" height="172" rx="4" fill="#fff" stroke="#0a0a09" stroke-width="2"/><text x="544" y="652" class="k" font-size="30" font-weight="800" fill="#0a0a09" text-anchor="start">out/final.mp4</text><text x="544" y="696" class="m" font-size="23" font-weight="600" fill="#0a0a09" text-anchor="start">mix-mux.sh · verify.sh</text><text x="544" y="732" class="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">음악·목소리를 입힌 완성본</text><rect x="520" y="352" width="400" height="172" rx="4" fill="#fff" stroke="#0a0a09" stroke-width="2"/><text x="544" y="400" class="k" font-size="30" font-weight="800" fill="#0a0a09" text-anchor="start">렌더 분석</text><text x="544" y="444" class="m" font-size="23" font-weight="600" fill="#0a0a09" text-anchor="start">ref-analyze.py</text><text x="544" y="480" class="m" font-size="23" font-weight="600" fill="#0a0a09" text-anchor="start">qa/render-analysis.json</text><rect x="520" y="100" width="400" height="172" rx="4" fill="#fff" stroke="#c2410c" stroke-width="3"/><text x="544" y="148" class="k" font-size="30" font-weight="800" fill="#c2410c" text-anchor="start">gate.py ref</text><text x="544" y="192" class="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">지표마다 목표·값·차이 %</text><text x="544" y="228" class="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">범위 밖이면 exit 1 → 계획</text><line x1="40" y1="1068" x2="920" y2="1068" stroke="#d6d3cb" stroke-width="1.5"/><text x="40" y="1112" class="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">움직임은 1/30초당 값이라 fps가 달라도 비교됩니다.</text><text x="40" y="1148" class="k" font-size="24" font-weight="400" fill="#57554f" text-anchor="start">게이트는 mp4만 보므로 어느 엔진이든 같은 기준이에요.</text></svg>
