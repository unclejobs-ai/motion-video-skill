<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="ref-pipeline-title ref-pipeline-desc">
  <title id="ref-pipeline-title">레퍼런스 분석 파이프라인</title>
  <desc id="ref-pipeline-desc">레퍼런스에서 목표를 정하고, 계획과 엔진을 거쳐 만든 완성본을 같은 지표로 분석해 비교합니다. 목표값은 마지막 ref 게이트에도 전달됩니다.</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; font-size: 26px; fill: #242824; }
      .title { font-size: 34px; font-weight: 700; }
      .heading { font-size: 28px; font-weight: 700; }
      .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', monospace; font-size: 24px; }
      .muted { fill: #626860; }
      .accent { fill: #B8441A; }
      .rule { stroke: #626860; stroke-opacity: .24; }
      .flow { fill: none; stroke: #626860; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#626860" stroke-width="1.5"/></marker>
  </defs>
  <rect width="720" height="1560" fill="#FFFFFF"/>
  <text x="40" y="68" class="title">레퍼런스 분석 파이프라인</text>
  <text x="40" y="112" class="muted">같은 지표로 목표와 완성본을 비교해요.</text>
  <path d="M40 164H680" class="rule"/>
  <text x="40" y="208" class="mono muted">01</text>
  <text x="100" y="208" class="heading">레퍼런스 영상</text>
  <text x="100" y="248" class="mono">reference.mp4</text>
  <text x="100" y="284" class="muted">커밋하지 않고 숫자만 남김</text>
  <path d="M56 228V298" class="flow"/>
  <path d="M40 316H680" class="rule"/>
  <text x="40" y="360" class="mono muted">02</text>
  <text x="100" y="360" class="heading">분석 · ref-analyze.py</text>
  <text x="100" y="400" class="muted">컷·홀드 · 광학 흐름 · 블러</text>
  <text x="100" y="436" class="muted">심도 띠 · 그레인 · 질감</text>
  <path d="M56 380V450" class="flow"/>
  <path d="M40 468H680" class="rule"/>
  <text x="40" y="512" class="mono muted">03</text>
  <text x="100" y="512" class="heading accent">목표 · ref/targets.json</text>
  <text x="100" y="552" class="muted">지표별 목표와 허용 오차</text>
  <text x="100" y="588" class="muted">ANALYSIS.md가 인용</text>
  <path d="M56 532V602" class="flow"/>
  <path d="M40 620H680" class="rule"/>
  <text x="40" y="664" class="mono muted">04</text>
  <text x="100" y="664" class="heading">계획</text>
  <text x="100" y="704" class="mono">plan.mjs · look-fit.mjs</text>
  <text x="100" y="740" class="mono">BEATSHEET.md</text>
  <path d="M56 684V754" class="flow"/>
  <path d="M40 772H680" class="rule"/>
  <text x="40" y="816" class="mono muted">05</text>
  <text x="100" y="816" class="heading">엔진 (바꿔 끼움)</text>
  <text x="100" y="856" class="mono">Remotion — carry</text>
  <text x="100" y="892" class="mono">HyperFrames — HTML</text>
  <path d="M56 836V906" class="flow"/>
  <path d="M40 924H680" class="rule"/>
  <text x="40" y="968" class="mono muted">06</text>
  <text x="100" y="968" class="heading">완성본 · out/final.mp4</text>
  <text x="100" y="1008" class="mono">mix-mux.sh · verify.sh</text>
  <text x="100" y="1044" class="muted">음악·목소리를 입힌 완성본</text>
  <path d="M56 988V1058" class="flow"/>
  <path d="M40 1076H680" class="rule"/>
  <text x="40" y="1120" class="mono muted">07</text>
  <text x="100" y="1120" class="heading">렌더 분석 · ref-analyze.py</text>
  <text x="100" y="1160" class="mono">qa/render-analysis.json</text>
  <text x="100" y="1196" class="muted">레퍼런스와 같은 분석으로 측정</text>
  <text x="560" y="512" class="muted">목표값</text>
  <path d="M646 512H668V1250H646" class="flow" stroke-dasharray="5 7"/>
  <path d="M56 1140V1212" class="flow"/>
  <rect x="40" y="1232" width="600" height="192" rx="12" fill="#FFFFFF" stroke="#B8441A" stroke-width="2"/>
  <text x="64" y="1274" class="mono accent">gate.py ref</text>
  <text x="64" y="1318" class="accent">목표·측정값·차이를 지표마다 비교</text>
  <text x="64" y="1360" class="mono">PASS · exit 0: 다음 단계</text>
  <text x="64" y="1398" class="mono accent">BLOCK · exit 1: 계획을 고침</text>
  <text x="40" y="1482" class="muted">움직임은 1/30초당 값: fps가 달라도 비교.</text>
  <text x="40" y="1524" class="muted">완성본 비교는 엔진과 무관하게 같은 기준.</text>
</svg>
