<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="392" viewBox="0 0 800 392" role="img" aria-labelledby="strip-title strip-desc">
  <title id="strip-title">Frame strip</title>
  <desc id="strip-desc">Same start. The character changes after 1 s. gate clips creates this for each clip: qa/strip-&lt;clip&gt;.png</desc>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; font-size: 32px; fill: #242824; }
    .title { font-size: 34px; font-weight: 700; }
    .label { fill: #626860; }
  </style>
  <rect width="800" height="392" fill="#FFFFFF"/>
  <text x="20" y="54" class="title">Frame strip</text>
  <image x="20" y="88" width="759" height="70" xlink:href="strip-frames.png"/>
  <text x="83.25" y="198" class="label" text-anchor="middle">Key</text>
  <text x="209.75" y="198" class="label" text-anchor="middle">0 s</text>
  <text x="336.25" y="198" class="label" text-anchor="middle">1.0 s</text>
  <text x="462.75" y="198" class="label" text-anchor="middle">1.5 s</text>
  <text x="589.25" y="198" class="label" text-anchor="middle">2.0 s</text>
  <text x="715.75" y="198" class="label" text-anchor="middle">3.0 s</text>
  <text x="20" y="264">Same start. The character changes after 1 s.</text>
  <text x="20" y="308">gate clips creates this for each clip:</text>
  <text x="20" y="352">qa/strip-&lt;clip&gt;.png</text>
</svg>
