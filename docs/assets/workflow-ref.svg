<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1608" viewBox="0 0 720 1608" role="img" aria-labelledby="workflow-ref-title workflow-ref-desc">
  <title id="workflow-ref-title">제작 단계와 단계별 게이트</title>
  <desc id="workflow-ref-desc">레퍼런스 분석부터 조립까지 7단계. 산출물을 검사하고 PASS면 다음 단계, BLOCK이면 수정 후 같은 게이트를 재실행합니다.</desc>
  <defs>
