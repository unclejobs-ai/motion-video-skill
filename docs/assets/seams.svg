      .heading { font-size: 28px; font-weight: 700; }
      .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', monospace; font-size: 24px; }
      .muted { fill: #626860; }
      .label { font-size: 24px; fill: #626860; }
      .accent { fill: #B8441A; }
      .rule { stroke: #626860; stroke-opacity: .24; }
      .flow { fill: none; stroke: #626860; stroke-width: 2; marker-end: url(#arrow); }
    </style>
